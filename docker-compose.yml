services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_PATH: /data/light_budget.db
    volumes:
      - light-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  light-data:
